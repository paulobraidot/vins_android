name: Android CI

on:
  push:
    branches: [ "main", "jules" ]
  pull_request:
    branches: [ "main", "jules" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Download Thirdparty Dependencies (OpenCV SDK)
        run: |
          mkdir -p app/src/main/cpp/thirdparty/opencv-4.1.0-android-sdk
          cd app/src/main/cpp/thirdparty/opencv-4.1.0-android-sdk
          curl -L -o opencv.zip https://github.com/opencv/opencv/releases/download/4.1.0/opencv-4.1.0-android-sdk.zip
          unzip -q opencv.zip
          rm opencv.zip

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Prepare APK artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk vins_android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vins_android.apk
          path: vins_android.apk

name: Android CI

on:
  push:
    branches: [ "main", "jules" ]
  pull_request:
    branches: [ "main", "jules" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Install NDK 21.4.7075529
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Setup Thirdparty Dependencies (OpenCV, Boost, Eigen, Ceres)
        run: |
          chmod +x setup_thirdparty.sh
          ./setup_thirdparty.sh

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Prepare APK artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk vins_android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vins_android.apk
          path: vins_android.apk
